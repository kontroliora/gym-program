<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Дневник Павел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column phone app, sticky tab bar at bottom; cards = steps of the session in order */
:root{
  --bg:#eef0f2; --card:#ffffff; --ink:#1a1f24; --mute:#5d6873; --line:#d7dce1;
  --acc:#c2571c; --acc-soft:#fbe9df; --ok:#2f7a4d; --ok-soft:#e3f2e8; --info:#2b5d8a; --info-soft:#e2ecf6;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161a; --card:#1b2127; --ink:#e8ecef; --mute:#9aa6b1; --line:#2c353e;
  --acc:#f08a4b; --acc-soft:#3a2518; --ok:#6cc68f; --ok-soft:#1c3024; --info:#7fb2e0; --info-soft:#1a2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161a; --card:#1b2127; --ink:#e8ecef; --mute:#9aa6b1; --line:#2c353e;
  --acc:#f08a4b; --acc-soft:#3a2518; --ok:#6cc68f; --ok-soft:#1c3024; --info:#7fb2e0; --info-soft:#1a2a3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
h1{font:700 30px/1.05 var(--disp);letter-spacing:.3px;margin:4px 0 2px;text-wrap:balance}
h2{font:700 22px/1.1 var(--disp);margin:18px 0 8px;letter-spacing:.3px}
.sub{color:var(--mute);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:600 13px var(--body);padding:8px 2px;border-radius:10px}
.tabs button[aria-selected="true"]{color:var(--acc);background:var(--acc-soft)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 17px var(--disp);letter-spacing:.3px}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.cardio{border-color:var(--info);background:var(--info-soft)}
.card.stretch{border-color:var(--ok);background:var(--ok-soft)}
.card.morning{border-style:dashed}
.ex-top{display:flex;gap:10px;align-items:flex-start}
.num{font:700 26px/1 var(--disp);color:var(--acc);min-width:24px}
.ex-name{font-weight:600;font-size:16px}
.en{display:inline-block;margin-top:4px;font-size:12px;color:var(--info);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 6px}
.spec div{background:var(--bg);border-radius:8px;padding:6px 8px}
.spec b{display:block;font:700 18px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.spec span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;border-radius:8px;padding:4px 8px;margin:4px 6px 0 0;background:var(--acc-soft);color:var(--acc)}
.tech{font-size:13.5px;color:var(--mute);margin:6px 0 0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:600;margin-top:10px}
.prev{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:10px}
.prev .lbl{margin-top:0}
.prow{display:flex;gap:10px;align-items:baseline;margin-top:3px}
.pkg{font:700 20px/1 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.pnote{font-size:14px;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.wu{font-size:13px;color:var(--info);margin-top:6px;font-variant-numeric:tabular-nums}
.logrow{display:flex;gap:8px;margin-top:4px}
.logrow .kg{width:86px;flex:0 0 86px;font:700 20px var(--disp);text-align:center}
.logrow .nt{flex:1;min-width:0}
textarea{width:100%;min-height:44px;margin-top:8px;resize:vertical}
.saved{font-size:11.5px;color:var(--ok);height:14px}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.chk input{width:20px;height:20px}
ul.st{margin:6px 0 0;padding-left:18px}ul.st li{margin:4px 0}
.status{font-size:12px;color:var(--mute);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:600}
.tw{overflow-x:auto}
.meal h3{margin:0 0 4px;font:700 20px var(--disp)}
.meal .when{font-size:12.5px;color:var(--mute)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 15px var(--body)}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.big{font:700 40px/1 var(--disp);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.note-box{border-left:3px solid var(--acc);padding-left:10px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Дневник Павел</h1>
    <div class="sub" id="dayline">Сваляне до ~88 кг · 12–14% · кръстът е приоритет №1</div>
    <div class="status" id="syncStatus">Свързване…</div>
  </header>

  <section id="p-train">
    <div class="bar">
      <div class="seg" id="tSeg" role="group" aria-label="Тренировка"></div>
    </div>
    <div class="bar">
      <label for="dateIn" class="sub">Дата</label>
      <input type="date" id="dateIn">
      <span class="sub" id="nextHint"></span>
    </div>
    <div id="trainBody"></div>
  </section>

  <section id="p-food" hidden></section>
  <section id="p-weight" hidden></section>
  <section id="p-rules" hidden></section>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-train" aria-selected="true" data-p="p-train">Тренировка</button>
  <button role="tab" id="tab-food" aria-selected="false" data-p="p-food">Храна</button>
  <button role="tab" id="tab-weight" aria-selected="false" data-p="p-weight">Тегло</button>
  <button role="tab" id="tab-rules" aria-selected="false" data-p="p-rules">Правила</button>
</nav>

// ---------- STORAGE ----------
let db=null, sessions=[], weights=[];
const LS="pavel_log_v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS))||{sessions:{},weights:{}}}catch(e){return {sessions:{},weights:{}}}}
function lsSave(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
const local=lsLoad();
function setStatus(t){document.getElementById("syncStatus").textContent=t}

const writing={};
async function writeDoc(col,id,body){
  if(db){
    const key=col+"/"+id;
    while(writing[key]) await writing[key];
    const p=db.collection(col).doc(id).set(body).catch(async e=>{
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*600));return db.collection(col).doc(id).set(body)}
      throw e});
    writing[key]=p.finally(()=>{delete writing[key]});
    try{await p;return true}catch(e){setStatus("Не се записа: "+(e.message||e.code)+". Записано само в телефона.");}
  }
  const bucket=col==="sessions"?local.sessions:local.weights; bucket[id]=body; lsSave(local);
  if(!db){ if(col==="sessions") mergeLocalSessions(); else mergeLocalWeights(); }
  return !db;
}
function mergeLocalSessions(){sessions=Object.values(local.sessions).sort((a,b)=>b.date.localeCompare(a.date))}
function mergeLocalWeights(){weights=Object.values(local.weights).sort((a,b)=>b.date.localeCompare(a.date))}
async function delDoc(col,id){ if(db){try{await db.collection(col).doc(id).delete()}catch(e){}} else {delete (col==="sessions"?local.sessions:local.weights)[id];lsSave(local);col==="sessions"?mergeLocalSessions():mergeLocalWeights();} }

const today=new Date(); const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let curT=1, curDate=iso(today);
function sessionId(){return curDate+"-t"+curT}
function curSession(){return sessions.find(s=>s.id===sessionId())||{id:sessionId(),date:curDate,t:curT,notes:{},done:{}}}
function nextTraining(){const last=sessions.filter(s=>s.date<iso(today)&&Object.keys(s.notes||{}).length).sort((a,b)=>b.date.localeCompare(a.date))[0]; if(!last) return null; return last.t%5+1}
function exGroup(id){for(const k in T){const x=T[k].ex.find(e=>e.id===id);if(x)return x.g||x.id}return id}
function groupIds(id){const g=exGroup(id),out=[];for(const k in T)T[k].ex.forEach(e=>{if((e.g||e.id)===g)out.push(e.id)});return out}
function lastNote(exId){const ids=groupIds(exId),sid=sessionId();let best=null;
  sessions.forEach(s=>{if(!s.notes||s.id===sid)return; if(s.date>curDate)return;
    ids.forEach(id=>{const v=s.notes[id];if(!v)return;const nv=norm(v);if(!nv.kg&&!nv.note)return;
      const key=s.date+"|"+String(s.updated||0).padStart(15,"0");
      if(!best||key>best.key)best={key,date:s.date,text:v,t:s.t};});});
  return best?{date:best.date,text:best.text,t:best.t}:null}
function r25(x){const v=Math.round(x/2.5)*2.5;return (v%1===0?String(v):v.toFixed(1)).replace(".",",")}
function warmupText(w,kgStr,fromPrev){
  if(!w||w==="—") return "";
  if(/без тежест/.test(w)) return "Вработваща: без тежест × 12";
  const kg=parseFloat(String(kgStr||"").replace(",","."));
  if(!(kg>0)) return "Напиши работната тежест и тук излизат вработващите.";
  const pre=fromPrev?" (по миналия път)":"";
  if(/^2/.test(w)) return "Вработващи"+pre+": "+r25(kg*0.4)+" кг × 8–10 → "+r25(kg*0.6)+" кг × 5";
  if(/12/.test(w)) return "Вработваща"+pre+": "+r25(kg*0.5)+" кг × 12";
  return "Вработваща"+pre+": "+r25(kg*0.5)+" кг × 8";
}
function norm(v){if(!v)return {kg:"",note:""};if(typeof v==="string")return {kg:"",note:v};return {kg:v.kg||"",note:v.note||""}}
function fmtDate(d){const [y,m,dd]=d.split("-");return dd+"."+m}

function saveNote(field,key,val,lbl){
  clearTimeout(timers[key]);

    const s=JSON.parse(JSON.stringify(curSession()));
    s[field]=s[field]||{}; if(field==="notes"){ if(val.kg||val.note) s.notes[key]=val; else delete s.notes[key]; } else { s.done[key]=val; }
    s.updated=Date.now();
    const idx=sessions.findIndex(x=>x.id===s.id); if(idx>=0) sessions[idx]=s; else sessions.push(s);
    await writeDoc("sessions",s.id,s);

    const same=sessions.filter(z=>z.t===s.t).sort((a,b)=>b.date.localeCompare(a.date));
    same.slice(4).forEach(z=>{delete local.sessions[z.id];});
    if(same.length>4){lsSave(local);mergeLocalSessions();}

}

function buildArchive(){
  const lines=["ДНЕВНИК ПАВЕЛ – архив "+fmtDate(iso(new Date()))+"."+iso(new Date()).slice(0,4),""];
  const ss=sessions.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!ss.length) lines.push("Няма записани тренировки.");
  ss.forEach(s=>{
    const t=T[s.t]; if(!t) return;
    const rows=t.ex.filter(x=>s.notes&&s.notes[x.id]).map(x=>{const v=norm(s.notes[x.id]);return "  "+x.n+": "+(v.kg?v.kg+" кг":"—")+(v.note?" · "+v.note:"")});
    if(!rows.length) return;
    lines.push(fmtDate(s.date)+" – T"+s.t+" "+t.name);lines.push(...rows);lines.push("");
  });
  if(weights.length){lines.push("ТЕГЛО");weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>lines.push("  "+fmtDate(w.date)+": "+w.kg.toFixed(1)+" кг"))}
  return lines.join("\n");
}

// ---------- TABS ----------
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  ["p-train","p-food","p-weight","p-rules"].forEach(id=>document.getElementById(id).hidden=(id!==b.dataset.p));
  try{localStorage.setItem("pv_tab",b.dataset.p)}catch(e){}
  window.scrollTo(0,0);
});
document.getElementById("dateIn").value=curDate;
document.getElementById("dateIn").onchange=e=>{curDate=e.target.value||iso(today);renderTrain()};

// ---------- BOOT ----------
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
mergeLocalSessions(); mergeLocalWeights();
const todayS=sessions.find(s=>s.date===curDate&&Object.keys(s.notes||{}).length); const n0=todayS?todayS.t:nextTraining(); if(n0) curT=n0;
renderSeg(); renderTrain(); renderFood(); renderWeight(); renderRules();
setStatus("Записва се в този телефон");

if(false)(async()=>{
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){db=null}
  if(!db){setStatus("Записва се само в този телефон");return}
  setStatus("Записва се в облака");
  let first=true;
  db.collection("sessions").orderBy("date","desc").limit(400).onSnapshot(snap=>{
    sessions=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    // pull any phone-only notes into the cloud once
    if(first){first=false;
      Object.values(local.sessions).forEach(s=>{if(!sessions.find(x=>x.id===s.id)){sessions.push(s);db.collection("sessions").doc(s.id).set(s).catch(()=>{})}});
      const n=nextTraining(); if(n&&!document.activeElement.matches("textarea")) curT=n;
      renderSeg();
    }
    if(!document.activeElement||!document.activeElement.matches("textarea")) renderTrain();
  },e=>setStatus("Връзката прекъсна – презареди страницата"));
  db.collection("weight").orderBy("date","desc").limit(400).onSnapshot(snap=>{
    weights=snap.docs.map(d=>d.data()); drawWeights();
  },()=>{});
})();
</script>
